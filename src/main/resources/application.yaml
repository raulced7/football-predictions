spring:
  application:
    name: football-predictions
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  threads:
    virtual:
      enabled: true

app:
  groups:
    max-members: 50
    max-owned-per-user: 10
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-0123456789}
    expiration: 2h
    issuer: football-predictions