spring:
  application:
    name: football-predictions
  servlet:
    multipart:
      # La app reduce la foto antes de subirla; esto es solo el límite de seguridad
      max-file-size: 2MB
      max-request-size: 2MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_updates: true
  threads:
    virtual:
      enabled: true

app:
  groups:
    max-members: 50
    max-owned-per-user: 10
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-0123456789}
    expiration: 2h
    issuer: football-predictions
  football-data:
    token: ${FOOTBALL_DATA_TOKEN:}
  sync:
    enabled: true
    calendar-cron: "0 30 4 * * *"
    live-check-interval: PT5M
  avatars:
    # Sin R2 configurado (en local), las fotos se guardan en una carpeta temporal y las sirve el backend
    public-base-url: ${AVATARS_PUBLIC_BASE_URL:}
    r2:
      endpoint: ${AVATARS_R2_ENDPOINT:}
      bucket: ${AVATARS_R2_BUCKET:}
      access-key-id: ${AVATARS_R2_ACCESS_KEY_ID:}
      secret-access-key: ${AVATARS_R2_SECRET_ACCESS_KEY:}
  mail:
    from: "Golify <no-reply@golifyapp.com>"
    resend-api-key: ${RESEND_API_KEY:}