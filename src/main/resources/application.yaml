spring:
  application:
    name: football-predictions
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_updates: true
  threads:
    virtual:
      enabled: true

app:
  groups:
    max-members: 50
    max-owned-per-user: 10
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-0123456789}
    expiration: 2h
    issuer: football-predictions
  football-data:
    token: ${FOOTBALL_DATA_TOKEN:}
  sync:
    enabled: true
    calendar-cron: "0 30 4 * * *"
    live-check-interval: PT5M