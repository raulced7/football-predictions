# Perfil de producción: se activa con SPRING_PROFILES_ACTIVE=prod

spring:
  docker:
    compose:
      enabled: false

app:
  jwt:
    # Sin valor por defecto: si falta JWT_SECRET, la aplicación no arranca
    secret: ${JWT_SECRET}
  avatars:
    # Sin valores por defecto: en producción las fotos tienen que ir a R2 (el disco de Railway se borra al desplegar)
    public-base-url: ${AVATARS_PUBLIC_BASE_URL}
    r2:
      endpoint: ${AVATARS_R2_ENDPOINT}
      bucket: ${AVATARS_R2_BUCKET}
      access-key-id: ${AVATARS_R2_ACCESS_KEY_ID}
      secret-access-key: ${AVATARS_R2_SECRET_ACCESS_KEY}
  mail:
    # Sin valor por defecto: en producción los correos tienen que enviarse de verdad
    resend-api-key: ${RESEND_API_KEY}

# La documentación de la API solo se publica en local
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false